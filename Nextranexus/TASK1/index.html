<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form with Icons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-RXf+QSDCUQs6Cj8j8FvKZ6R7ZB7Vbf1a5OYZvYUyZ3EyP3dJxF9Vj3d5+yKZHTzOT9+fEkpB6hw+ILrXZmV+DQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <!--Main Registration Form-->
  <form class="form-container">
    <h2>Registration Form</h2>

    <div class="form-group">
      <label for="fullname"><i class="fa fa-user"></i> Full Name</label>
      <input type="text" id="fullname" name="fullname" required />
    </div>

    <div class="form-group">
      <label for="phone"><i class="fa fa-phone"></i> Contact Number</label>
      <input type="tel" id="phone" name="phone" required />
    </div>

    <div class="form-group">
      <label for="address"><i class="fa fa-house"></i> Address</label>
      <textarea id="address" name="address" required></textarea>
    </div>

    <div class="form-group">
      <label for="company"><i class="fa fa-building"></i> Company Name</label>
      <input type="text" id="company" name="company" required />
    </div>

    <div class="form-group">
      <label for="email"><i class="fa fa-envelope"></i> Email Address</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="department"><i class="fa fa-sitemap"></i> Department</label>
      <select id="department" name="department" required>
        <option value="">Select</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Marketing">Marketing</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa fa-venus-mars"></i> Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" required /> Male</label>
        <label><input type="radio" name="gender" value="female" /> Female</label>
        <label><input type="radio" name="gender" value="prefer_not" /> Prefer not to say</label>
      </div>
    </div>

    <button type="submit" class="btn-submit"><i class="fa fa-paper-plane"></i> Submit</button>
  </form>

</body>
</html>
